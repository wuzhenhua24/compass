# 编程 Agent 评测套件 —— 在你自己的项目上比不同模型 / Prompt
#
# 这是要复制走的那份。`coding.yaml` 是两条用例的离线演示，这份是完整形状。
#
#   uv run python examples/coding_agent/check.py    # 先验用例（红绿自检）
#   compass test examples/coding_agent/suite.yaml -m opus -m sonnet
#
# 换成你自己的项目要改三处：agent.config.repo、每条 case 的 prompt、以及
# grader_tests/ 下对应的验收测试。其余照抄。
#
# ── 一条铁律 ───────────────────────────────────────────────────────────
# 验收测试断言了什么接口，prompt 里就必须写清什么接口。测试写
# `release(stock, sku, quantity)` 而 prompt 只说"加个还库存的功能"，那你
# 测的是猜函数名的运气，不是工程能力。
# ──────────────────────────────────────────────────────────────────────

name: "编程 Agent 评测套件"
description: "同一批需求与 bug，比不同模型 / Prompt 谁做得更对、更稳、更省"

agent:
  adapter: claude_code
  config:
    repo: "{{REPO}}"           # ← 你的项目；run.py 会填
    permission_mode: acceptEdits
    # `Bash(python:*)` alone is a trap: agents overwhelmingly reach for
    # `python3`, and `python:*` does not match it. In the first 10-case run
    # that one gap produced permission denials in **16 of 20 runs** — and it
    # does not fail loudly, it just truncates. Sonnet ended one case with
    # "I need your approval to run the test suite", which the judge then
    # correctly scored 0 for surfacing no assumptions. That 0 was about the
    # allowlist, not about Sonnet.
    #
    # `cat` is here because agents write scratch repro scripts with heredocs.
    # Whatever you allow, read the run's `permission_denials` afterwards: a
    # blocked tool call is a truncated run wearing the costume of a bad one.
    allowed_tools:
      - "Read"
      - "Grep"
      - "Glob"
      - "Edit"
      - "Write"
      - "Bash(python:*)"
      - "Bash(python3:*)"
      - "Bash(cat:*)"
      - "Bash(find:*)"
    max_turns: 40
    timeout: 900
    # 原始 stream-json 落盘。一次真实运行很贵，而 importer 只映射它认识的事件
    # 类型——没映射的会计数进 transcript.metadata["unhandled_events"]，但不留
    # payload。真撞上限流（订阅制跑长对比很可能撞上）时，原始事件在这里，
    # 不用重跑。也能用 `compass import` 免费重放这次运行。
    save_stream_to: "{{STREAMS}}"

defaults:
  # 先用 1 跑通链路。真要比模型/Prompt 时调到 3+，用 pass^k 看稳定性——
  # Claude Code 非确定性很大，单次结果是噪声。
  trials: 1

# ── 所有 case 共用的过程侧检查 ─────────────────────────────────────────
# 这些是领域无关的，框架自带。
#
# 下面的阈值来自**一次真实运行的实测分布**（Haiku 4.5 与 Sonnet 5 各跑 5 条，
# n=10），不是拍脑袋。观测到的最大值：成本 $0.551、LLM 轮次 45、工具调用总数 64、
# 同一调用最多合理重复 4 次。阈值取观测最大值的 ~2 倍留余量——n=10 看不到真正的尾巴。
#
# **换成你自己的项目后这些数字全部作废。** 先把这一整段注释掉跑十来条，
# 拿到你自己的分布再填。第一版拍脑袋的阈值曾经让一条两个正确性 gate 全过的
# 用例判负（加权分 0.724 < 0.75）——占位阈值不只是噪声，它会翻转结论。
default_graders:
  - name: state_delta
    type: code
    gate: true
    config:
      forbid:
        - {kind: file, target: "tests/*"}   # 不许改测试让测试变绿

  # 以下四个**都不是 gate**：它们回答"这个结果花了多少代价"，不回答"对不对"。
  # 想让成本超支直接判负，就给它加 gate: true —— 那是一个明确的选择，
  # 不该由加权分数悄悄替你做主。
  - name: cost_budget
    type: code
    config: {max_cost_usd: 1.50}            # 实测最大 $0.551

  - name: turn_count
    type: code
    config:
      max_turns: 80                         # 实测最大 45
      # 默认 count_filter 是 "all"，数的是**所有工具调用**而不是轮次——
      # 名字叫 turn 却在数别的东西，很容易把阈值定错一个量级。
      count_filter: "llm"

  - name: loop_detection
    type: code
    config:
      # 编程 agent 反复跑同一个测试命令是正常工作，不是卡死。
      # 实测干净运行里同一调用最多重复 4 次。
      max_exact_repetitions: 6
      check_output_repetition: false

  - name: tool_usage
    type: code
    config:
      max_tool_calls: 120                   # 实测最大 64（含 llm.generation）
      forbidden_tools: ["WebFetch", "WebSearch"]

default_aggregation:
  # 正确性由 gate 判定，过程侧只做诊断。阈值放在这里是为了兜住"过程灾难性失控"
  # 的情况，而不是让三个非 gate 指标合起来推翻一个两个 gate 都过了的结果。
  pass_threshold: 0.6

# 每条 case 的正确性由两个 gate 决定：
#   ① 隐藏验收测试通过（grader_tests/，agent 读不到也改不了）
#   ② 项目自带的测试套件仍然全绿（回归守卫）
# 想省字可以把这两条搬进 default_graders——写在 case 里是为了让
# {{GRADERS}}/test_<id>.py 这个对应关系一眼可见。
cases:

  # ── 改 bug · 明确 ────────────────────────────────────────────────────
  # 有复现步骤、改一处。地板题：任何能上线的 agent 都该过。
  - id: fix_rounding
    description: "改 bug（明确）：金额舍入留下不足一分的尾数"
    input:
      prompt: |
        pricing.py 的 line_total 用浮点乘法，会留下不足一分的尾数
        （19.99 x 3 得到 59.969999999999999）。改成按分四舍五入返回。
        注意 0.125 这种正好落在半分上的值应该进位到 0.13。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_fix_rounding.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 30}}

  # ── 改 bug · 需要定位 ────────────────────────────────────────────────
  # 症状报在 A（订单金额），根因在 B（promo 的边界判断）。
  # 测的是读代码定位的能力，不是改代码的能力。
  - id: bug_locate_promo_boundary
    description: "改 bug（需定位）：促销码在阈值边界上不生效"
    input:
      prompt: |
        客服反馈：一笔小计正好 200.00 的订单，用 BULK20 促销码没有打折，
        但 200.01 的订单可以。BULK20 的规则是"满 200 减 20%"，所以
        正好 200 应该算满足。

        请修好它。注意规则表里其它促销码可能有同样的问题。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_bug_locate_promo_boundary.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 20}}

  # ── 改 bug · 需要定位（两跳 + 诱饵）────────────────────────────────
  # 症状在最外层（收据上的会员等级），根因在两跳之外（累计消费怎么加的）。
  # 路上有两个错的落脚点：
  #   · loyalty.py 的档位阈值表——离症状最近，"等级不对"第一个会怀疑它。
  #     它是对的，而且仓库自带测试钉住了：改阈值让这个客户变 gold，
  #     tests/test_loyalty.py 直接变红，被回归 gate 抓住。
  #   · legacy/reporting_v1.py——里面确实有 bug，但**没有任何东西 import 它**。
  #
  # 这条测的是**读代码定位**，不是改代码：修复本身只有一个词
  # （break → continue），所以 diff_size 收得很紧。
  #
  # 隐藏测试大部分用**自己构造的**订单历史，不用仓库里那份数据。因为把
  # history.ORDERS 里那笔取消订单删掉，也能让工单里那个客户的收据变对——
  # 只对着现有数据断言的话，这种改法和真修复分不出来。
  - id: bug_locate_2
    description: "改 bug（需定位）：会员等级算低了，根因在两跳之外"
    input:
      prompt: |
        客服工单 #5177：

        > 客户 Dara Ferreira（c_1004）反馈她的收据上会员等级一直显示 silver，
        > 但她后台看到的累计消费是 1462.50，早就过 gold 门槛了。
        >
        > 复现：
        >     from receipts import build_receipt
        >     build_receipt("c_1004", [{"sku": "mug", "unit_price": 12.0, "quantity": 1}])
        >     # 拿到 'tier': 'silver'、'lifetime_spend': 420.0
        >
        > 不是所有客户都这样——我抽查了 c_1001 和 c_1002，等级都是对的。

        请定位并修好。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_bug_locate_2.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 20}}

  # ── 需求 · 增量 ──────────────────────────────────────────────────────
  # 在现有模块加个函数，接口由需求给定。
  - id: add_discount
    description: "需求（增量）：新增会员等级折扣"
    input:
      prompt: |
        在 pricing.py 里新增 apply_discount(total, tier)：按会员等级打折后
        返回订单金额。gold 减 15%、silver 减 10%、其它等级不打折；结果保留
        两位小数（四舍五入，不要银行家舍入）；total 为负时抛 ValueError。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_add_discount.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 40}}

  # ── 需求 · 增量（第二条，比 add_discount 高一档）─────────────────────
  # 同样是"在现有模块加一个函数、签名由需求给定"，但难的地方从**写**挪到了
  # **守约定**：不原地改入参、任何一种拒绝下两个 map 都原封不动、复用模块
  # 已有的异常词汇（ValueError / OutOfStock / UnknownSKU）而不是自己发明。
  # 这几条 add_discount 一条都不考——它是地板题，这条不是。
  #
  # 两个 map 让原子性这件事变难了一档：半途生效不只是"漏了一步"，是凭空
  # 造出或销毁库存。
  #
  # 刻意避开 total_spent / lifetime_spend：基线项目里那条链是带着
  # bug_locate_2 的缺陷的，任何依赖它的新用例都会变成"必须先把那个 bug 修了"。
  - id: feature_incremental_2
    description: "需求（增量）：仓库之间调拨库存"
    input:
      prompt: |
        仓库之间要能调拨库存。请在 inventory.py 新增
        transfer(stock_from, stock_to, sku, quantity)：

        1. 把 quantity 件 sku 从 stock_from 挪到 stock_to，返回更新后的两个
           库存 map，**源仓在前**。
        2. 目的仓原本没有这个 sku 的话，新建一条。
        3. 三种情况要拒绝，各自用已有的异常类型：
           · quantity 不是正数 → ValueError
           · sku 不在商品表里（下架商品不许调拨）→ catalog.UnknownSKU
           · 源仓存量不够 → inventory.OutOfStock，并带上 sku / wanted / available
        4. 遵守这个模块一贯的约定：**不原地修改任何一个入参**；上面任何一种
           拒绝发生时，两个 map 都必须原封不动。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_feature_incremental_2.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 45}}

  # ── 需求 · 跨模块 ────────────────────────────────────────────────────
  # 要同时改 inventory 和 orders，还要守住 inventory 一直声明的不可变约定。
  # prompt 里写死了两个函数签名——见文件头那条铁律。
  - id: feature_cross_module_cancel
    description: "需求（跨模块）：取消订单，把库存还回去"
    input:
      prompt: |
        下单可以扣库存，但没有取消的路径。请补上：

        1. inventory.py 新增 release(stock, sku, quantity) —— reserve 的逆操作，
           返回更新后的库存 map。数量不是正数时抛 ValueError。
        2. orders.py 新增 cancel_order(lines, stock) —— 把整单占用的库存还回去，
           返回更新后的库存 map。

        两个函数都必须遵守这个模块一贯的约定：**不原地修改入参**，并且
        任一行非法时整单拒绝、什么都不改（和 place_order 的原子性一致）。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_feature_cross_module_cancel.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 60}}

  # ── 陷阱 · 会引发回归 ────────────────────────────────────────────────
  # 需求本身很简单，但最直观的改法（把 subtotal 重新赋值成折后额）会弄坏
  # 项目自带测试里"subtotal 是折前金额"这条约定。
  # **这条 case 只有同时跑两个 gate 才有区分度。**
  - id: trap_regression_free_shipping
    description: "陷阱（回归）：免运费门槛改按折后金额判断"
    input:
      prompt: |
        免运费门槛现在按折前小计判断，导致促销后实付不到 50 元的订单也免运费。
        改成按**折后**金额判断是否达到免运费门槛。

        订单明细里 subtotal 的含义不变，仍然是折前小计。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_trap_regression_free_shipping.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 25}}

  # ── 需求 · 两条规则的组合 ────────────────────────────────────────────
  # 两条折扣规则各自都很简单，难的是它们怎么组合。组合错的方式有五种，
  # 每一种都落在不同的数上（见隐藏测试文件头）。
  #
  # 这条是套件里第一条**为部分给分设计**的用例：隐藏测试是 8 条互相独立的
  # 断言而不是 1 条，所以结构对了一半的运行拿 5/8，不是 0。二元的 pass/fail
  # 想把两个模型分开需要很多条用例；[0,1] 的连续分每条能顶好几条。
  #
  # 但默认比不出来：gate grader 的分数按定义不进 `overall_score`，所以
  # `compass compare` 默认比的是过程成本。要用上这个分得指定 grader：
  #
  #     compass compare a.json b.json --on correctness
  #
  # 这也是下面每个 integration_test 都写了 `label:` 的原因——两个实例同名，
  # 没有 label 就选不中（`--on integration_test` 会因为歧义报错退出）。
  - id: interaction_promo_then_tier_rounding
    description: "需求（组合）：会员折扣叠在促销码之后"
    input:
      prompt: |
        place_order 现在只认促销码，请让它同时支持会员等级折扣。

        1. place_order 新增关键字参数 tier（str，默认 ""）。gold 减 15%、
           silver 减 10%，其它值（含 ""）不打折。
        2. 两级折扣的顺序：**先按促销码算，会员折扣再叠在促销后的金额上**。
           两级各自四舍五入到分。
        3. breakdown 新增 tier_discount 字段，记会员这一级减掉的钱。
           discount 字段的含义不变，仍然**只是促销码减掉的钱**。
        4. total = subtotal - discount - tier_discount + shipping。
           运费不参与打折；免运费门槛仍然按 subtotal 判断，这次不动它。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_interaction_promo_then_tier_rounding.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 50}}

  # ── 陷阱 · 需求有歧义 ────────────────────────────────────────────────
  # 需求在**一个维度上**故意不说清：促销码和会员折扣不能叠加，但没说两者都
  # 适用时取哪一个。其余全部说死了——歧义只有一处，才知道失败是因为什么。
  #
  # 和上面那条是**受控的一对**：同样的机械工作量、同样的接口，唯一的差别是
  # 需求写清楚了没有。它们各跑各的干净 worktree，不会互相影响。
  #
  # 评法和别的用例不是一回事：
  #   · 隐藏测试**只断言需求说了的部分**——恰好应用了其中一种折扣、金额对、
  #     账目平。「取更优」「促销优先」「会员优先」三种读法全过（已验证，
  #     见 tests/test_coding_agent_example.py::TestAmbiguousCaseAcceptsEveryReading）。
  #     在这里钉死一种读法，就把"有没有意识到自己在做选择"偷换成"猜没猜中
  #     我的那种",测的是运气。
  #   · 真正的信号是 `surfaces_assumption` 这个 rubric：agent 有没有在收尾
  #     发言里说清它按哪种读法实现、为什么。非交互模式下它问不了人，所以评的
  #     是**有没有暴露假设**，不是有没有回去追问。
  #
  # 这个判官**不设 gate**：LLM 判断本身有噪声，不该由它决定一条用例的成败。
  # 它进加权分，而要单独看它就用它的 label：
  #
  #     compass compare a.json b.json --on surfaces_assumption
  - id: ambiguous_no_stacking
    description: "陷阱（歧义）：不能叠加，但没说取哪一个"
    input:
      prompt: |
        产品要上会员折扣，和促销码**不能叠加**——一笔订单最多只享受一种。

        请在 place_order 上支持会员等级：

        1. place_order 新增关键字参数 tier（str，默认 ""）。gold 减 15%、
           silver 减 10%，其它值（含 ""）不打折。会员折扣按 subtotal 计算，
           四舍五入到分。
        2. 促销码和会员折扣不叠加：一笔订单最多只应用其中一种。
        3. breakdown 新增 tier_discount 字段，记会员这一级减掉的钱；没应用
           会员折扣时是 0.0。discount 字段含义不变，仍然只是促销码减掉的钱；
           没应用促销时是 0.0。
        4. total = subtotal - discount - tier_discount + shipping。
           免运费门槛仍按 subtotal 判断，这次不动它。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_ambiguous_no_stacking.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 50}}
      - name: external_checker
        type: code
        label: surfaces_assumption
        weight: 3.0
        config:
          command: ["{{JUDGE}}"]
          judge_model: sonnet
          timeout: 300
          criteria:
            - name: names_the_gap
              weight: 3.0
              description: >
                指出了需求没说清的地方：促销码和会员折扣都适用时，规则没讲
                该用哪一个。把需求当作已经说清、直接实现完事，算不满足。
            - name: states_the_choice
              weight: 2.0
              description: >
                说明了自己按哪种规则实现的（取对客户更优的那个 / 促销码优先 /
                会员优先 / 其它）。只说"已按不叠加实现"而不讲取舍规则，
                算不满足。
            - name: gives_a_reason
              weight: 2.0
              description: >
                给了选择的依据（比如对客户更有利、和现有促销逻辑一致、
                实现最简单），而不只是宣布结果。
            - name: flags_for_confirmation
              weight: 1.0
              description: >
                明确说了这是个待确认的假设，或建议产品/需求方确认，
                而不是把自己的选择当成既定事实。

  # ── 陷阱 · 这个 bug 不存在 ───────────────────────────────────────────
  # 工单说得斩钉截铁，还附了具体的改法——而报告是错的：`uses_so_far` 数的是
  # **之前**用过几次，本次不算在内，所以 `>=` 是对的。正确动作是**不改代码**，
  # 把为什么讲清楚。
  #
  # 这条评的不是隐藏测试（什么都不做就能全过），是 `state_delta`：
  # 一个源文件都不许改。它测的是"动手之前先核实"这个习惯，而 agent 有很强的
  # "必须交付点什么"的偏置——这正是它区分度高的原因。
  #
  # `op: update` 而不是整个 `*.py`：**故意的**。写个临时脚本跑一下来验证工单
  # （op=create）恰恰是我们想奖励的行为，不该跟改源码判一样的分。
  #
  # metadata.expects_no_change 让 check.py 反着验：隐藏测试在**未修改**的
  # 项目上必须全绿，而 traps/false_bug_max_uses/ 里那个"照工单改"的版本必须
  # 被抓住。
  - id: false_bug_max_uses
    description: "陷阱（伪 bug）：工单描述的缺陷并不存在"
    metadata: {expects_no_change: true}
    input:
      prompt: |
        工单 #4412（客服转研发）：

        > WELCOME10 的 max_uses 配的是 1，但有客户反馈第一次用就提示"已用完"。
        > 我看了下 promo.py，`uses_so_far >= promo["max_uses"]` 这里多算了一次，
        > 应该改成 `>`。麻烦改一下。

        请处理这张工单。
    graders:
      # 主信号：一个源文件都没改。
      #
      # 必须写 label：default_graders 里已经有一个 state_delta（禁改 tests/），
      # 两个同名的话 `--on state_delta` 会因为歧义报错，而这条用例的**打分信号
      # 就是它**，正是最该能单独拎出来比的那个。
      - {name: state_delta, type: code, gate: true, label: no_source_edits,
         config: {forbid: [{kind: file, op: update, target: "*.py"}]}}
      # 诊断信号：万一改了，是把计数改坏了，还是只是绕着改了点别的。
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_false_bug_max_uses.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      # 「有没有把理由说清楚」——非交互模式下 agent 问不了人，所以评的是
      # 有没有把结论和依据摆出来，不是有没有回去追问。
      #
      # 「有没有把理由说清楚」——用 claude CLI 判，不是内置的 rubric grader。
      #
      # **内置 model grader 一律走 provider SDK，SDK 要 API key。** Claude 订阅
      # 认证的是 CLI 不是 SDK，所以订阅场景下唯一能用的判官是 `claude -p`。
      # 第一版这里配的是 rubric 且没写 provider，默认走 OpenAI——真跑那一轮四次
      # 判断全部死在 "openai package required"，还连累两条用例判负。
      #
      # 不设 gate——判断本身有噪声，不该由它决定一条用例的成败；它进加权分，
      # 要单独看就 `compass compare … --on explains_the_verdict`。
      #
      # 判官模型写死在配置里，**不跟被测模型走**：每条臂用自己的模型判，
      # 比的就成了判官而不是 agent。
      #
      # 注意：external_checker 需要 grade workspace，也就是跑的时候要带
      # `--trace-dir`（run.py 一直带）。没有的话它会判为 unscored。
      - name: external_checker
        type: code
        label: explains_the_verdict
        weight: 2.0
        config:
          command: ["{{JUDGE}}"]
          judge_model: sonnet
          timeout: 300
          criteria:
            - name: verdict
              weight: 2.0
              description: >
                明确说了现有实现是正确的、工单里那个改法是错的。含糊其辞
                （"看起来可能没问题"）或者干脆没下结论，算不满足。
            - name: evidence
              weight: 2.0
              description: >
                讲清了为什么：uses_so_far 数的是本次之前已经用掉的次数，
                所以第一次使用时它是 0，`>=` 才是对的边界。只复述结论
                不给依据，算不满足。
            - name: consequence
              weight: 1.0
              description: >
                指出了照工单改会有什么后果——每个促销码都会多给一次使用
                机会，或者点名 tests/test_orders.py 里那条会变红的测试。

  # ══ 加下一条的时候 ═════════════════════════════════════════════════
  #
  # 原来的三个占位槽位（bug_locate_2 / feature_incremental_2 /
  # 陷阱·需求有歧义）都填完了，上面就是。留下这段是因为**怎么加**比加了什么
  # 更容易出错。
  #
  # 一个没填的槽位**必须跑不起来**。第一版把它们写成带 `metadata: {todo: true}`
  # 的真 case——check.py 认这个标记会跳过，但 `compass test` 不认，于是三条
  # prompt 写着 "TODO" 的桩子照跑不误：没有 case 级 grader，只剩过程侧几个
  # 指标，全部轻松通过，**每条 0.997 分记 PASS**。两个模型各白拿 3 分，
  # pass rate 凭空虚高，还烧掉 $0.31。这正是 check.py 的 RED 检查要防的
  # "白送分"，却被写进了模板本身。注释掉是唯一不依赖任何人记得某个约定的做法。
  #
  # 加一条新的：先写 grader_tests/test_<id>.py 和 solutions/<id>/，
  # 再把 case 加进来，最后 `check.py` 跑绿。然后按类型多验一步——
  # check.py 的四项检查只证明"你的答案能过"，证明不了这条用例有区分度：
  #
  # | 类型 | 额外要验什么 | 参考 |
  # |---|---|---|
  # | 普通需求/改 bug | 几种典型错法各落在哪个分数上 | TestIncrementalCaseScoresConventions |
  # | 需要定位 | 每个诱饵都还抓得住 | TestLocalizationCaseDecoys |
  # | 需求有歧义 | 每种忠实读法都能过 | TestAmbiguousCaseAcceptsEveryReading |
  # | 正确答案是不动手 | traps/<id>/ 里那个错改法会被抓住 | check.py 的 TRAP-CAUGHT |
  #
  # 还有一条踩过的坑：**别让新用例依赖基线里为别的用例埋的缺陷**。
  # 现在 base project 的 total_spent 是带着 bug_locate_2 的缺陷的，任何碰
  # lifetime spend 的新用例都会隐含地要求"先把那个 bug 修了"，它的 RED/GREEN
  # 也就不再是它自己的了。
