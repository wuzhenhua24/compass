# 跨栈对比 · B 侧：pi + gemini-2.5-flash
#
# 和 crossstack.claude.yaml / crossstack.codex.yaml 是**同一份判分契约**——同样
# 三条用例、同样的隐藏验收测试、同样的 grader 与阈值，逐字相同。三个文件之间只有
# `agent:` 那一段不同。
#
# 为什么必须逐字相同：`compass compare` 会比对每条 case 的 `grader_fingerprint`
# （= grader 列表 + aggregation + expect + leak_markers 的内容哈希，**刻意不含
# agent 配置和 prompt**）。指纹不同时它会明确警告"差异不能归因于 agent"。指纹
# 相同，换 adapter、换模型才是这次对比唯一变动的量。
#
# `tests/test_coding_agent_example.py::TestCrossStackSuitesShareOneContract`
# 钉住了这条不变量——三份文件哪天飘了，测试先红。
#
#   uv run python examples/coding_agent/run.py --suite crossstack.claude.yaml \
#       -m haiku --trials 3 --out ./crossstack-run
#   uv run python examples/coding_agent/run.py --suite crossstack.pi.yaml \
#       -m google/gemini-2.5-flash --trials 3 --out ./crossstack-run
#
#   compass compare ./crossstack-run/results.haiku.json \
#                   ./crossstack-run/results.google-gemini-2.5-flash.json \
#                   --on correctness
#
# 每次跑用**同一个 --out**：仓库基线因此是同一份，per-model 的结果文件名不冲突。
#
# ── 这次对比测的是「栈」，不是「模型」 ────────────────────────────────
# Claude Code、pi、Codex 的系统提示词、内置工具集、上下文策略都不一样。所以结论
# 只能读作"这套 CLI 配这个模型，在这批需求上表现如何"，不能读作"gemini-2.5-flash
# 比 haiku 强/弱"。要比模型，请在**同一个 CLI**上换 -m。
# ──────────────────────────────────────────────────────────────────────

name: "跨栈对比 · pi"
description: "同一批需求与判分契约，比不同 CLI + 模型的组合"

agent:
  adapter: pi
  config:
    repo: "{{REPO}}"                    # run.py 填
    model: "google/gemini-2.5-flash"    # -m 覆盖这个键
    # thinking 显式写死而不是用 pi 的默认值：这次对比要可复现。它同时也是
    # **另一条独立的轴**，别和模型轴混在一次跑里：
    #   compass test crossstack.pi.yaml --model-key thinking -m low -m high
    thinking: "medium"
    # 工具不设白名单，理由同 A 侧。
    #
    # 机器上装了什么扩展 / 技能，不该影响"哪个栈更好"的结论——关掉它们，这份
    # 结果换台机器才还成立。仓库自带的 AGENTS.md 保持开启：那是被测项目的一
    # 部分，两侧都该读到。
    no_extensions: true
    no_skills: true
    # 没有 max_turns —— pi 没有对应的 flag，写上去只是个不起作用的键。
    # 轮次靠下面的 turn_count 诊断，跑飞的运行靠 timeout 兜底。
    timeout: 900
    save_stream_to: "{{STREAMS}}"

# ══════════════════════════════════════════════════════════════════════
# 以下到文件末尾，三份 crossstack 套件（claude / pi / codex）逐字相同。
# 改一边就要改另外两边。
# ══════════════════════════════════════════════════════════════════════

defaults:
  trials: 1

default_graders:
  # 完整性 gate：不许改测试让测试变绿。跨栈同义——三个 adapter 都从各自
  # CLI 的编辑工具里填 state_delta，target 都归一到相对 worktree 的路径。
  - name: state_delta
    type: code
    gate: true
    config:
      forbid:
        - {kind: file, target: "tests/*"}

  # 以下四个都不是 gate：回答"这个结果花了多少代价"，不回答"对不对"。
  #
  # 跨栈时阈值取**各侧的并集再留余量**，否则一边永远绿、一边永远红，这一项
  # 就不再是测量而是站队。真正比代价请看 `compass compare --metric cost_usd`
  # 之类的原始数值——不设阈值，直接比数。
  - name: cost_budget
    type: code
    # 一个**预算决定**，不是"实测最大值的两倍"：一条业务需求你愿意付多少。
    # 三侧用同一个数，因为便宜是结果、不是豁免。codex 那侧还得先登记价格，
    # 否则它报的是 $0.00——见 crossstack.codex.yaml 头部第 1 点。
    config: {max_cost_usd: 1.00}

  - name: turn_count
    type: code
    config:
      max_turns: 80
      # 默认 count_filter 是 "all"，数的是**所有工具调用**而不是轮次——
      # 名字叫 turn 却在数别的东西，很容易把阈值定错一个量级。
      count_filter: "llm"

  - name: loop_detection
    type: code
    config:
      # 编程 agent 反复跑同一个测试命令是正常工作，不是卡死。默认
      # max_single_tool_calls 是 10，实测已经有模型跑了 19 次 bash。
      max_single_tool_calls: 30
      max_exact_repetitions: 6
      check_output_repetition: false

  - name: tool_usage
    type: code
    config:
      max_tool_calls: 120
      # 注意这条只在 Claude 侧真正生效：pi 的内置工具里没有联网工具，codex
      # 的叫小写 web_search（且三侧都关了网）。**按工具名比的维度跨栈不可
      # 比**，可比的只有总量。
      forbidden_tools: ["WebFetch", "WebSearch"]

default_aggregation:
  pass_threshold: 0.6

cases:

  - id: fix_rounding
    description: "改 bug（明确）：金额舍入留下不足一分的尾数"
    input:
      prompt: |
        pricing.py 的 line_total 用浮点乘法，会留下不足一分的尾数
        （19.99 x 3 得到 59.969999999999999）。改成按分四舍五入返回。
        注意 0.125 这种正好落在半分上的值应该进位到 0.13。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_fix_rounding.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 30}}

  - id: bug_locate_promo_boundary
    description: "改 bug（需定位）：促销码在阈值边界上不生效"
    input:
      prompt: |
        客服反馈：一笔小计正好 200.00 的订单，用 BULK20 促销码没有打折，
        但 200.01 的订单可以。BULK20 的规则是"满 200 减 20%"，所以
        正好 200 应该算满足。

        请修好它。注意规则表里其它促销码可能有同样的问题。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_bug_locate_promo_boundary.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 20}}

  - id: add_discount
    description: "需求（增量）：新增会员等级折扣"
    input:
      prompt: |
        在 pricing.py 里新增 apply_discount(total, tier)：按会员等级打折后
        返回订单金额。gold 减 15%、silver 减 10%、其它等级不打折；结果保留
        两位小数（四舍五入，不要银行家舍入）；total 为负时抛 ValueError。
    graders:
      - {name: integration_test, type: code, gate: true, label: correctness,
         config: {script: "python -m pytest {{GRADERS}}/test_add_discount.py -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: integration_test, type: code, gate: true, label: regression,
         config: {script: "python -m pytest tests/ -q",
                  workdir: "{workspace}", output_format: pytest, pass_threshold: 1.0}}
      - {name: diff_size, type: code, config: {max_total_changes: 40}}
