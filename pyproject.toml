[project]
name = "compass-qa"
version = "0.1.0"
description = "A universal Agent QA framework for testing, evaluation, and observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Compass Team" }
]
keywords = ["agent", "qa", "testing", "evaluation", "llm", "aigc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "aiofiles>=23.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
# One extra per grader domain (see compass.graders.domains). The domain's
# graders always import — only their heavy backends are optional, and a grader
# whose backend is missing says so in its result instead of raising. The
# `coding` domain shells out to the project's own tools, so it has no extra.
image = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "open-clip-torch>=2.20.0",
]
data = [
    "sqlparse>=0.4.0",
    "duckdb>=0.9.0",
]
all = [
    "compass-qa[image,data]",
]

# Dev tooling, plus the domain backends the test suite actually exercises.
# A PEP 735 group rather than an extra, because `uv sync` installs groups by
# default and extras only when asked — and `uv sync` is what CLAUDE.md tells a
# contributor to run. As an extra, a plain `uv sync` uninstalled pytest, ruff
# and mypy, so the documented workflow could not run.
# `sqlparse` is here because six sql_syntax tests need a real parser; without it
# they skip. `torch` deliberately is not — the image graders degrade when it is
# absent and the suite is fully green without it, so the default sync stays
# small. Working on that domain: `uv sync --extra image`.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "sqlparse>=0.4.0",
    "duckdb>=0.9.0",
]

[project.scripts]
compass = "compass.cli.main:cli"

[project.urls]
Homepage = "https://github.com/wuzhenhua24/compass"
Documentation = "https://github.com/wuzhenhua24/compass#readme"
Repository = "https://github.com/wuzhenhua24/compass"
Issues = "https://github.com/wuzhenhua24/compass/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

# Ship the docs inside the wheel so `compass docs` works on an installed
# Compass, not just in a checkout. Listed one by one rather than mapping the
# whole docs/ directory: docs/ also holds local working notes (interview.md,
# todos.md, idea.md) that are gitignored and must never reach a published
# wheel either.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "compass/docs/README.md"
"docs/cheatsheet.md" = "compass/docs/cheatsheet.md"
"docs/core-design.md" = "compass/docs/core-design.md"
"docs/graders.md" = "compass/docs/graders.md"
"docs/scenario-config.md" = "compass/docs/scenario-config.md"
"docs/analysis.md" = "compass/docs/analysis.md"
"docs/integrations.md" = "compass/docs/integrations.md"
"docs/skills.md" = "compass/docs/skills.md"
"docs/roadmap.md" = "compass/docs/roadmap.md"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict = true

# Optional dependencies: each is imported inside a try/except ImportError and the
# grader degrades when it is absent, so they are deliberately not in [project]
# dependencies. Without this, mypy reports them as missing on every dev machine.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "duckdb.*",
    "jsonschema.*",
    "open_clip.*",
    "openai.*",
    "tomli.*",
    "tomllib.*",
    "yaml.*",
]
ignore_missing_imports = true

# ── Type-checking ratchet ──
#
# `mypy src/compass` is green, and most modules are genuinely strict-clean:
# anything not listed below is gated, so new code and edits to clean modules
# cannot regress. The modules listed here are quarantined rather than fixed;
# deleting this block and re-running reports what they still carry — 89 findings
# across 28 files when this was last measured.
#
# Those findings are NOT strictness artifacts — with strict, warn_return_any and
# warn_unused_ignores off, 70 of them remain. They share one root cause: values read out
# of `dict[str, Any]` payloads (grader `findings`, `trial_metrics`, parsed JSON)
# flow into typed positions, so mypy sees `Any`/`object` where a float or a list
# is required. A sample was audited and none were real bugs, but mypy cannot
# verify them either.
#
# Burning this list down means modelling those payloads (TypedDict) rather than
# casting at each boundary. Do it per module: delete the entry, fix what mypy
# then reports, keep the suite green. Entries also go stale on their own when
# other work cleans a module, so re-measure before trusting the list — that is
# how these two came off it. Do not add new entries.
[[tool.mypy.overrides]]
module = [
    "compass.adapters.coding",
    "compass.adapters.environment",
    "compass.core.result",
    "compass.core.sweep",
    "compass.core.transcript",
    "compass.graders.base",
    "compass.graders.code.common.style",
    "compass.graders.code.common.transcript_graders",
    "compass.graders.domains.coding.functional",
    "compass.graders.domains.coding.integration",
    "compass.graders.domains.coding.quality",
    "compass.graders.domains.coding.security",
    "compass.graders.domains.data._utils",
    "compass.graders.domains.data.data_correctness",
    "compass.graders.domains.data.query_quality",
    "compass.graders.domains.data.reasoning_trace",
    "compass.graders.domains.data.self_correction",
    "compass.graders.domains.data.sql_equivalence",
    "compass.graders.domains.image.aesthetic",
    "compass.graders.domains.image.assertions",
    "compass.graders.domains.image.edit_diff",
    "compass.graders.domains.image.edit_locality",
    "compass.graders.domains.image.semantic",
    "compass.graders.domains.image.technical",
    "compass.graders.model.rubric",
    "compass.graders.domains.image.safety",
    "compass.report.analyzer",
    "compass.report.console",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
