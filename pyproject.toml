[project]
name = "compass-qa"
version = "0.1.0"
description = "A universal Agent QA framework for testing, evaluation, and observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Compass Team" }
]
keywords = ["agent", "qa", "testing", "evaluation", "llm", "aigc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "aiofiles>=23.0.0",
    "jsonschema>=4.0.0",
    "sqlparse>=0.4.0",
]

[project.optional-dependencies]
eval = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "open-clip-torch>=2.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "compass-qa[eval,dev]",
]

[project.scripts]
compass = "compass.cli.main:cli"

[project.urls]
Homepage = "https://github.com/your-org/compass"
Documentation = "https://github.com/your-org/compass#readme"
Repository = "https://github.com/your-org/compass"
Issues = "https://github.com/your-org/compass/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

# Ship the docs inside the wheel so `compass docs` works on an installed
# Compass, not just in a checkout. Listed one by one rather than mapping the
# whole docs/ directory: docs/ also holds local working notes (interview.md,
# todos.md, idea.md) that are gitignored and must never reach a published
# wheel either.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "compass/docs/README.md"
"docs/core-design.md" = "compass/docs/core-design.md"
"docs/graders.md" = "compass/docs/graders.md"
"docs/scenario-config.md" = "compass/docs/scenario-config.md"
"docs/analysis.md" = "compass/docs/analysis.md"
"docs/integrations.md" = "compass/docs/integrations.md"
"docs/roadmap.md" = "compass/docs/roadmap.md"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
