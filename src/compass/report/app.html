<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass</title>
<style>
  /* One theme, two palettes. Every colour below is a token: this page is read
     on a laptop next to a terminal as often as it is shared as a link, so it
     follows the reader's system rather than picking a side. */
  :root {
    color-scheme: light;
    --bg: oklch(98.5% 0.003 274);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(97.2% 0.005 274);
    --surface-3: oklch(94.6% 0.008 274);
    --border: oklch(91% 0.007 274);
    --border-strong: oklch(84% 0.012 274);
    --ink: oklch(25% 0.02 274);
    --ink-2: oklch(45% 0.017 274);
    --ink-3: oklch(52% 0.015 274);
    --accent: oklch(48% 0.18 274);
    --accent-2: oklch(40% 0.17 274);
    --accent-soft: oklch(95.5% 0.025 274);
    --focus: oklch(55% 0.19 274);

    --pass: oklch(58% 0.14 158);
    --pass-bg: oklch(95% 0.05 158);
    --pass-ink: oklch(41% 0.11 158);
    --fail: oklch(57% 0.21 27);
    --fail-bg: oklch(95.5% 0.035 27);
    --fail-ink: oklch(45% 0.18 27);
    --warn: oklch(72% 0.16 72);
    --warn-bg: oklch(96% 0.05 82);
    --warn-ink: oklch(46% 0.11 66);
    --scope-bg: oklch(95% 0.04 300);
    --scope-ink: oklch(44% 0.16 300);
    --quiet-bg: oklch(96% 0.006 274);
    --quiet-ink: oklch(42% 0.02 274);
    /* Chart fills are read *behind* data, so they are a step quieter than the
       badge tints that carry the same meaning in text. */
    --zone-good: oklch(97.4% 0.024 158);
    --zone-mixed: oklch(97.8% 0.024 85);
    --zone-poor: oklch(97.4% 0.02 27);

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r1: 6px; --r2: 10px; --r3: 14px;
    --t-xs: .75rem; --t-sm: .8125rem; --t-md: .875rem;
    --t-lg: 1rem; --t-xl: 1.25rem; --t-2xl: 1.5rem;
    --shadow: 0 1px 2px oklch(25% 0.02 274 / .05), 0 1px 3px oklch(25% 0.02 274 / .06);
    --scroll-shadow: oklch(20% 0.02 274 / .18);
    --dur: 160ms; --dur-fast: 110ms; --ease: cubic-bezier(.22, 1, .36, 1);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: oklch(17.5% 0.012 274);
      --surface: oklch(21.5% 0.014 274);
      --surface-2: oklch(25% 0.014 274);
      --surface-3: oklch(29% 0.016 274);
      --border: oklch(31% 0.016 274);
      --border-strong: oklch(39% 0.018 274);
      --ink: oklch(95% 0.006 274);
      --ink-2: oklch(80% 0.012 274);
      --ink-3: oklch(69% 0.014 274);
      --accent: oklch(78% 0.12 274);
      --accent-2: oklch(86% 0.09 274);
      --accent-soft: oklch(30% 0.06 274);
      --focus: oklch(78% 0.12 274);

      --pass: oklch(74% 0.15 158);
      --pass-bg: oklch(30% 0.07 158);
      --pass-ink: oklch(87% 0.13 158);
      --fail: oklch(70% 0.17 27);
      --fail-bg: oklch(31% 0.09 27);
      --fail-ink: oklch(88% 0.09 27);
      --warn: oklch(80% 0.14 78);
      --warn-bg: oklch(32% 0.07 72);
      --warn-ink: oklch(90% 0.09 82);
      --scope-bg: oklch(31% 0.07 300);
      --scope-ink: oklch(87% 0.08 300);
      --quiet-bg: oklch(28% 0.012 274);
      --quiet-ink: oklch(84% 0.012 274);
      --zone-good: oklch(24.5% 0.019 158);
      --zone-mixed: oklch(24.5% 0.017 85);
      --zone-poor: oklch(24.5% 0.018 27);
      --shadow: 0 1px 2px oklch(0% 0 0 / .3);
      --scroll-shadow: oklch(0% 0 0 / .55);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.55;
    font-size: var(--t-md);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-2); text-decoration: underline; }
  :focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r1);
  }
  code {
    font-family: var(--mono); font-size: .92em;
    background: var(--surface-3); color: var(--ink);
    padding: 1px 5px; border-radius: 4px;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: var(--s5) var(--s4); }

  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  header .container {
    display: flex; align-items: flex-start; gap: var(--s4);
    padding-top: var(--s5); padding-bottom: var(--s5);
  }
  header .heading { flex: 1; min-width: 0; }
  header h1 {
    font-size: var(--t-2xl); font-weight: 600; letter-spacing: -.02em;
    line-height: 1.2; text-wrap: balance;
  }
  header .timestamp {
    color: var(--ink-3); font-size: var(--t-sm); margin-top: var(--s1);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3);
  }
  header .skills { display: inline-flex; align-items: center; gap: var(--s2); }
  header .crumb { font-size: var(--t-sm); margin-bottom: var(--s1); color: var(--ink-3); }
  header .crumb a { color: var(--ink-3); }
  header .crumb a:hover { color: var(--accent); text-decoration: none; }

  /* Live means "this page is still being written". A dot that breathes says
     that better than a word, so the word is backup, not the signal. */
  header .live {
    display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
    color: var(--pass-ink); background: var(--pass-bg);
    padding: 2px 9px 2px 7px; border-radius: 20px; font-size: var(--t-xs);
  }
  header .live::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--pass); animation: pulse 2s var(--ease) infinite;
  }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.8); } }

  .langs { display: flex; flex: none; }
  .langs button {
    font: inherit; font-size: var(--t-sm); line-height: 1; cursor: pointer;
    padding: 7px 12px; color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--border); border-right-width: 0;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .langs button:first-child { border-radius: var(--r1) 0 0 var(--r1); }
  .langs button:last-child { border-radius: 0 var(--r1) var(--r1) 0; border-right-width: 1px; }
  .langs button:hover { background: var(--surface-2); color: var(--ink); }
  .langs button.on {
    background: var(--accent-soft); color: var(--accent-2);
    font-weight: 600; border-color: var(--border-strong);
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r2); box-shadow: var(--shadow);
    margin-bottom: var(--s5); overflow: hidden;
  }
  .card > h2 {
    font-size: var(--t-lg); font-weight: 600; letter-spacing: -.01em;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border);
  }
  .card .body { padding: var(--s4); }

  /* One divided strip, not six floating tiles: these numbers are read across,
     and hairlines carry that better than shadows and gaps. */
  .summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: var(--r2);
    overflow: hidden; margin-bottom: var(--s5);
  }
  .summary-card { background: var(--surface); padding: var(--s3) var(--s4); }
  .summary-card .value {
    font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .summary-card .label { color: var(--ink-3); font-size: var(--t-xs); margin-top: 2px; }
  .summary-card.passed .value { color: var(--pass-ink); }
  .summary-card.failed .value { color: var(--fail-ink); }
  .summary-card.error .value { color: var(--warn-ink); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: var(--s2) var(--s3); white-space: nowrap;
    border-bottom: 1px solid var(--border); background: var(--surface-2);
    font-size: var(--t-xs); font-weight: 600; color: var(--ink-3);
  }
  td {
    padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  /* The label column keeps its row one line tall; the table scrolls sideways
     inside its card, which is cheaper than rows of three different heights. */
  tbody td:first-child { white-space: nowrap; }
  tbody tr.clickable { cursor: pointer; transition: background var(--dur-fast) var(--ease); }
  tbody tr.clickable:hover { background: var(--surface-2); }
  tbody tr.clickable:has(:focus-visible) { background: var(--surface-2); }
  /* Measurements are read down a column, so they never wrap: a bar that drops
     below its own percentage, or a digest broken across two lines, costs more
     than the horizontal scroll this table already has. */
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.num { text-align: right; }
  .mono { font-family: var(--mono); font-size: var(--t-sm); }
  td > .mono { white-space: nowrap; }
  .muted { color: var(--ink-2); }
  .dim { color: var(--ink-3); }
  /* Rows are scanned, so they stay one line tall. The full value is in the
     cell's title rather than in a second line of every row. */
  .trunc { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pos { color: var(--pass-ink); }
  .neg { color: var(--fail-ink); }
  .warn { color: var(--warn-ink); }
  .err { color: var(--fail-ink); }

  /* The whole row is the click target; this is the keyboard's way in, and the
     chevron is what says the row opens rather than navigates. */
  .disclosure {
    display: inline-flex; align-items: center; gap: var(--s2);
    font: inherit; color: inherit; background: none; border: 0;
    padding: 0; cursor: pointer; text-align: left;
  }
  .disclosure::before {
    content: ""; flex: none; width: 6px; height: 6px; opacity: .5;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transition: transform var(--dur) var(--ease);
  }
  .disclosure[aria-expanded="true"]::before { transform: rotate(45deg); }
  .disclosure:hover::before { opacity: .9; }
  .row-link { color: inherit; font-weight: 600; }
  .row-link:hover { color: var(--accent); text-decoration: none; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    font-size: var(--t-xs); font-weight: 500; line-height: 1.5;
  }
  .badge.passed { background: var(--pass-bg); color: var(--pass-ink); }
  .badge.failed { background: var(--fail-bg); color: var(--fail-ink); }
  .badge.error  { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.skipped{ background: var(--quiet-bg); color: var(--quiet-ink); }
  .badge.scope  { background: var(--scope-bg); color: var(--scope-ink); }
  .badge.tag    { background: var(--quiet-bg); color: var(--quiet-ink); margin: 1px 3px 1px 0; }

  .bar {
    width: 72px; height: 6px; background: var(--surface-3); border-radius: 3px;
    overflow: hidden; display: inline-block; vertical-align: middle; margin-right: var(--s2);
  }
  .bar > div { height: 100%; border-radius: 3px; }
  .bar .good { background: var(--pass); }
  .bar .medium { background: var(--warn); }
  .bar .poor { background: var(--fail); }

  .filters {
    display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .filters input, .filters select {
    padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--r1);
    font: inherit; font-size: var(--t-md); color: var(--ink); background: var(--surface);
    transition: border-color var(--dur-fast) var(--ease);
  }
  .filters input { flex: 1; min-width: 200px; }
  .filters input::placeholder { color: var(--ink-3); }
  .filters input:hover, .filters select:hover { border-color: var(--ink-3); }
  .filters .count { color: var(--ink-3); font-size: var(--t-sm); margin-left: auto; }

  .detail { background: var(--surface-2); }
  .detail .body { padding: var(--s3) var(--s4) var(--s4); }
  .detail > td { border-bottom: 1px solid var(--border); }
  .detail h3 {
    font-size: var(--t-sm); font-weight: 600; color: var(--ink-2);
    margin: var(--s4) 0 var(--s2);
  }
  .detail h3:first-child { margin-top: 0; }
  /* No fill mode: the row is visible on its own, and the animation only adds
     the arrival. A paused animation (hidden tab, headless render) must not be
     able to leave the panel blank. */
  .detail .body > * { animation: rise var(--dur) var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(-3px); } }
  .kv {
    display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4);
    color: var(--ink-2); font-size: var(--t-sm);
  }
  .detail .scroll { border: 1px solid var(--border); border-radius: var(--r1); }
  pre {
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
    padding: var(--s3); border-radius: var(--r1); overflow-x: auto;
    font-family: var(--mono); font-size: var(--t-xs); line-height: 1.5;
  }

  .note {
    padding: var(--s3) var(--s4); border-radius: var(--r1);
    font-size: var(--t-sm); margin-bottom: var(--s5);
  }
  .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .note.info { background: var(--quiet-bg); color: var(--quiet-ink); }
  /* A note that explains the table above it belongs to that table, not to the
     page: no gap, no second rounded corner floating in the margin. */
  .card > .note { margin: 0; border-radius: 0; border-top: 1px solid var(--border); }
  .note code { background: oklch(50% 0.02 274 / .12); color: inherit; }
  .note ul { margin: var(--s2) 0 0 var(--s5); }
  .empty { padding: var(--s7) var(--s4); text-align: center; color: var(--ink-3); }

  /* A table wider than its card scrolls. The edge shadow appears only when
     there is more to see, so a clipped last column reads as "scroll me"
     instead of as a bug. */
  .scroll {
    overflow-x: auto;
    background:
      linear-gradient(to right, var(--surface) 40%, transparent) left / 28px 100% no-repeat local,
      linear-gradient(to left, var(--surface) 40%, transparent) right / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, var(--scroll-shadow), transparent)
        left / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, var(--scroll-shadow), transparent)
        right / 12px 100% no-repeat scroll,
      var(--surface);
  }

  /* Charts are data, so they take their ink from the same tokens as the text
     around them. Hard-coded hex here is how a chart survives a theme switch
     looking like a screenshot of the other one. */
  .chart { max-width: 100%; height: auto; }
  .chart .axis { stroke: var(--border-strong); stroke-width: 1.5; }
  .chart .grid { stroke: var(--border); }
  .chart .guide { stroke: var(--border-strong); stroke-dasharray: 5 5; }
  .chart .diag { stroke: var(--border); stroke-dasharray: 3 3; }
  .chart .tick { fill: var(--ink-3); font-size: 11px; }
  .chart .axis-label { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
  .chart .zone-good { fill: var(--zone-good); }
  .chart .zone-mixed { fill: var(--zone-mixed); }
  .chart .zone-poor { fill: var(--zone-poor); }
  .chart .dot { stroke: var(--surface); stroke-width: 1.5; }
  .chart .dot.good { fill: var(--pass); }
  .chart .dot.poor { fill: var(--fail); }
  .chart .dot.medium { fill: var(--warn); }
  .chart .dot.stale { fill: var(--ink-3); }
  .chart .series { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .spark { fill: none; stroke-width: 1.5; }
  .spark.up, .sparkdot.up { stroke: var(--pass); fill: var(--pass); }
  .spark.down, .sparkdot.down { stroke: var(--fail); fill: var(--fail); }
  .spark.flat, .sparkdot.flat { stroke: var(--ink-3); fill: var(--ink-3); }

  @media (max-width: 720px) {
    .container { padding: var(--s4) var(--s3); }
    header .container { flex-wrap: wrap; gap: var(--s3); }
    header h1 { font-size: var(--t-xl); }
    .summary { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); }
    .summary-card .value { font-size: 1.3rem; }
    .filters input { min-width: 100%; }
    .filters .count { margin-left: 0; }
  }

  /* Touch: the same controls, at a size a thumb can hit. */
  @media (pointer: coarse) {
    .filters input, .filters select { padding: 11px 12px; }
    .langs button { padding: 11px 14px; }
    td { padding: var(--s3); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="heading">
      <div class="crumb" id="crumb"></div>
      <h1 id="title">Compass</h1>
      <div class="timestamp" id="subtitle"></div>
    </div>
    <div class="langs" id="langs"></div>
  </div>
</header>
<div class="container" id="view"><div class="empty">…</div></div>

<script>
"use strict";

const SCHEMA = "compass.run/1";
const POLL_MS = 3000;
const view = document.getElementById("view");
const state = { index: null, docs: {}, comparisons: {}, poll: null };
// Filter values and expanded rows, kept per slug so a live refresh does not
// undo what the reader is in the middle of doing.
const ui = {};

// ---------- helpers ----------

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => (Number(x || 0) * 100).toFixed(1) + "%";
const num = (x) => Number(x || 0).toFixed(2);
const grade = (x) => (x >= 0.7 ? "good" : x >= 0.4 ? "medium" : "poor");
// A metric is whatever the grader emitted — a count, a cost, or a rate across
// trials. Significant digits rather than fixed decimals: rounding a rate to
// 0.333 and a $0.0004 cost to 0.000 are not the same mistake.
const metric = (v) => (typeof v === "number" && Number.isFinite(v) && !Number.isInteger(v)
  ? Number(v.toPrecision(4)) : v);
const plural = (n, one) => n + " " + one + (n === 1 ? "" : "s");

// ---------- language ----------
//
// Two catalogues, one per language. A value is either a plain string (a label)
// or a function of the interpolation vars (a sentence, so each language keeps
// its own word order and its own plural rules instead of being assembled from
// fragments). English is the fallback: a key missing from `zh` falls through to
// it, and a key missing from both renders as itself so it cannot hide.
//
// Data is never translated — case ids, grader names, scenario names, tags and
// the analyzer's own prose stay exactly as the run recorded them.
const MESSAGES = {
  en: {
    loading: "Loading…",
    loading_slug: (v) => `Loading ${v.slug}…`,
    all_runs: "All runs",
    back_to_runs: "Back to all runs",
    live: "live",
    live_title: "re-reading from disk",
    lang_label: "Language",

    // index
    runs_built: (v) => `${plural(v.n, "run")} · built ${v.when}`,
    no_runs: "No runs yet. Publish one with",
    th_run: "Run",
    th_pass_rate: "Pass Rate",
    th_trend: "Trend",
    th_passed: "Passed",
    th_errors: "Errors",
    th_avg_score: "Avg Score",
    th_scopes: "Scopes",
    th_updated: "Updated",
    trend_alt: "pass rate trend",
    index_note: "Each run is published independently — several repositories can build into this "
      + "same directory and the list accumulates. Pass rates are over evaluated cases; harness "
      + "errors are counted apart.",

    // comparisons index
    th_comparison: "Comparison",
    th_pass_rate_ab: "Pass Rate A → B",
    th_paired: "Paired",
    th_flips: "Flips",
    th_score_delta: "Score Δ",
    th_regraded: "Regraded",
    comparisons_note: (v) => `A comparison pairs two runs by case id. <strong>${v.regraded}</strong> `
      + "counts cases the two runs graded under different contracts — their difference is not "
      + "attributable to the agent.",
    regraded_word: "Regraded",

    // comparison view
    // Set with textContent, so the labels must not be escaped here.
    paired_cases: (v) => `${v.a} → ${v.b} · ${plural(v.n, "paired case")}`,
    not_attributable: (v) => "<strong>Not attributable to the agent.</strong> "
      + `${plural(v.n, "case")} were graded under a different contract in B than in A: ${v.ids}.`,
    card_pass_rate: (v) => `${esc(v.label)} pass rate`,
    card_fixed_by_b: "fixed by B",
    card_broken_by_b: "broken by B",
    card_both: "both pass / both fail",
    th_grader: "Grader",
    th_difference: "Difference (B − A)",
    gate_note: "Gate scores are excluded from the case score by design, so correctness only "
      + "shows up here — per grader.",
    th_process_metric: "Process metric",
    th_trials: "Trials",
    metrics_note: (v) => "No pass/fail on a metric, and on most of these a <strong>negative</strong> "
      + `difference is the better run. <strong>${v.sampled}</strong> marks cases where this metric `
      + "came from one trial rather than the mean over them.",

const LANGS = [["en", "EN"], ["zh", "中文"]];
const LANG_KEY = "compass.lang";
let LANG = initialLang();

function initialLang() {
  // A stored choice wins; otherwise follow the browser, so a reader on a
  // Chinese locale gets Chinese without having to find the switch.
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && MESSAGES[saved]) return saved;
  } catch (err) { /* storage blocked (private mode, file://) — fall through */ }
  const nav = (navigator.language || navigator.userLanguage || "").toLowerCase();
  return nav.startsWith("zh") ? "zh" : "en";
}

function t(key, vars) {
  const table = MESSAGES[LANG] || MESSAGES.en;
  const value = table[key] != null ? table[key] : MESSAGES.en[key];
  if (value == null) return key;   // an untranslated key shows itself, loudly
  return typeof value === "function" ? value(vars || {}) : value;
}

function setLang(lang) {
  if (!MESSAGES[lang] || lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (err) { /* see above */ }
  applyLang();
  // Re-render the current view from state that is already in memory: switching
  // language must never re-fetch, and must not lose filters or open rows.
  route();
}

function applyLang() {
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : "en";
  const box = document.getElementById("langs");
  box.setAttribute("aria-label", t("lang_label"));
  box.innerHTML = LANGS.map(([code, label]) =>
    `<button type="button" data-lang="${code}" class="${code === LANG ? "on" : ""}"
      aria-pressed="${code === LANG}">${label}</button>`).join("");
  box.querySelectorAll("button").forEach((b) => {
    b.onclick = () => setLang(b.dataset.lang);
  });
}

function bar(score) {
  const p = Math.max(0, Math.min(1, Number(score || 0))) * 100;
  return `<span class="bar"><div class="${grade(score)}" style="width:${p}%"></div></span>`;
}

function tags(list) {
  // Not `t` — that name is the translator now, and shadowing it here would be a
  // trap for the next edit inside this function.
  return (list || []).map((tag) => `<span class="badge tag">${esc(tag)}</span>`).join("");
}

// What the run had installed, as `name@digest`. The digest is the identity —
// a source path gets reused between versions and the content does not — so it
// is shown wherever a run is named, not tucked into a detail row.
function skillIds(skills) {
  return (skills || []).filter((s) => s && s.name)
    .map((s) => s.name + (s.digest ? "@" + String(s.digest).slice(0, 8) : ""));
}

function skillChips(skills) {
  return (skills || []).filter((s) => s && s.name).map((s) => {
    const files = s.files ? ` · ${t("skill_files", { n: s.files })}` : "";
    return `<span class="badge tag mono">${esc(s.name)}${s.digest
      ? "@" + esc(String(s.digest).slice(0, 8)) : ""}${esc(files)}</span>`;
  }).join("");
}

function duration(ms) {
  const s = Number(ms || 0) / 1000;
  return s >= 60 ? (s / 60).toFixed(1) + "m" : s >= 1 ? s.toFixed(1) + "s" : Math.round(ms) + "ms";
}

// The document stamps UTC ISO, which is right to store and hard to read in a
// table. Shown as local `YYYY-MM-DD HH:MM` — fixed rather than locale-formatted,
// so it stays sortable by eye and the same width in every row. The exact
// original is one hover away, because a shared report crosses time zones.
function stampText(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return String(iso || "");
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
    + `${p(d.getHours())}:${p(d.getMinutes())}`;
}

function stamp(iso) {
  return `<time datetime="${esc(iso)}" title="${esc(iso)}">${esc(stampText(iso))}</time>`;
}

async function loadJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(path + " → " + res.status);
  return res.json();
}

function schemaNote(doc) {
  if (!doc || !doc.schema || doc.schema === SCHEMA) return "";
  return `<div class="note warn">${t("schema_mismatch",
    { expected: esc(SCHEMA), found: esc(doc.schema) })}</div>`;
}

// ---------- index view ----------

function sparkline(entry) {
  const trail = (entry.history || []).slice().reverse().map((h) => Number(h.pass_rate || 0));
  const series = trail.concat([Number(entry.pass_rate || 0)]);
  if (series.length < 2) return '<span class="dim">—</span>';
  const w = 80, h = 22;
  const step = w / (series.length - 1);
  const points = series.map((v, i) => `${(i * step).toFixed(1)},${(h - v * h).toFixed(1)}`).join(" ");
  const last = series[series.length - 1], first = series[0];
  const dir = last > first ? "up" : last < first ? "down" : "flat";
  return `<svg width="${w}" height="${h}" class="chart" role="img" aria-label="${esc(t("trend_alt"))}">
    <polyline points="${points}" class="spark ${dir}"/>
    <circle cx="${w - 1}" cy="${(h - last * h).toFixed(1)}" r="2.5" class="sparkdot ${dir}"/>
  </svg>`;
}

function renderIndex() {
  const runs = state.index.runs || [];
  document.getElementById("crumb").innerHTML = "";
  document.getElementById("title").textContent = "Compass";
  document.title = "Compass";
  document.getElementById("subtitle").textContent =
    t("runs_built", { n: runs.length, when: stampText(state.index.generated || "") });

  if (!runs.length) {
    view.innerHTML = `<div class="card"><div class="empty">
      ${t("no_runs")} <code>compass site build results.json -o .</code></div></div>`
      + comparisonsTable();
    view.querySelectorAll("tr[data-compare]").forEach((tr) => {
      tr.onclick = () => { location.hash = "#/compare/" + tr.dataset.compare; };
    });
    return;
  }

  const rows = runs.map((entry) => {
    const scopes = entry.scopes || {};
    const badges = [scopes.outcome ? "outcome" : null, scopes.transcript ? "transcript" : null]
      .filter(Boolean).map((s) => `<span class="badge scope">${s}</span>`).join(" ");
    const skills = skillIds(entry.skills);
    // A real link, not a click handler on the row: a published report gets
    // shared one run at a time, so the run's own URL has to be copyable — and
    // it is what makes the row reachable from the keyboard.
    return `<tr class="clickable" data-slug="${esc(entry.slug)}">
      <td><a class="row-link" href="#/run/${encodeURIComponent(entry.slug)}">${esc(entry.name)}</a>
        <div class="mono dim">${esc(entry.slug)}</div>
        ${skills.length ? `<div class="mono dim">${esc(skills.join(", "))}</div>` : ""}</td>
      <td class="num">${bar(entry.pass_rate)}${pct(entry.pass_rate)}</td>
      <td class="num">${sparkline(entry)}</td>
      <td class="num">${entry.passed_cases || 0}/${entry.evaluated_cases || 0}</td>
      <td class="num">${entry.error_cases ? `<span class="badge error">${entry.error_cases}</span>` : "—"}</td>
      <td class="num">${num(entry.average_score)}</td>
      <td class="num">${badges || "—"}</td>
      <td class="mono dim">${stamp(entry.generated)}</td>
    </tr>`;
  }).join("");

  view.innerHTML = `${schemaNote(state.index)}
    <div class="card"><div class="scroll"><table>
      <thead><tr>
        <th>${t("th_run")}</th><th class="num">${t("th_pass_rate")}</th>
        <th class="num">${t("th_trend")}</th><th class="num">${t("th_passed")}</th>
        <th class="num">${t("th_errors")}</th><th class="num">${t("th_avg_score")}</th>
        <th class="num">${t("th_scopes")}</th><th>${t("th_updated")}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
    <div class="note info">${t("index_note")}</div>`;

  view.insertAdjacentHTML("beforeend", comparisonsTable());

  view.querySelectorAll("tr[data-slug]").forEach((tr) => {
    tr.onclick = () => { location.hash = "#/run/" + tr.dataset.slug; };
  });
  view.querySelectorAll("tr[data-compare]").forEach((tr) => {
    tr.onclick = () => { location.hash = "#/compare/" + tr.dataset.compare; };
  });
}

// ---------- comparisons ----------

// B − A, so a positive score difference means the candidate scored higher.
// On process metrics the sign reads the other way and the view says so rather
// than colouring "more expensive" green.
function signed(x, digits) {
  const n = Number(x || 0);
  return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(digits == null ? 3 : digits);
}

function interval(stats, digits) {
  if (!stats) return `<span class="mono dim">${t("not_measured")}</span>`;
  const d = digits == null ? 3 : digits;
  const range = `[${signed(stats.ci_low, d)}, ${signed(stats.ci_high, d)}]`;
  if (!stats.variance_observed) {
    return `<strong class="mono">${signed(stats.mean_diff, d)}</strong>
      <div class="mono dim">${t("no_spread")}</div>`;
  }
  const verdict = stats.significant
    ? `<span class="badge passed">${t("ci_excludes_zero")}</span>`
    : `<span class="badge skipped">${t("within_noise",
        { mde: Number(stats.mde || 0).toFixed(d) })}</span>`;
  return `<strong class="mono">${signed(stats.mean_diff, d)}</strong>
    <div class="mono dim">${range}</div>${verdict}`;
}

function comparisonsTable() {
  const rows = (state.index.comparisons || []);
  if (!rows.length) return "";
  const body = rows.map((c) => `
    <tr class="clickable" data-compare="${esc(c.slug)}">
      <td><a class="row-link" href="#/compare/${encodeURIComponent(c.slug)}">${esc(c.name)}</a>
        <div class="mono dim">${esc(c.label_a)} → ${esc(c.label_b)}</div></td>
      <td class="num">${pct(c.pass_rate_a)} → ${pct(c.pass_rate_b)}</td>
      <td class="num">${c.paired_cases || 0}</td>
      <td class="num">${c.improved ? `<span class="badge passed">+${c.improved}</span>` : ""}
        ${c.regressed ? `<span class="badge failed">−${c.regressed}</span>` : ""}
        ${!c.improved && !c.regressed ? "—" : ""}</td>
      <td class="num mono">${c.score_diff == null ? "—" : signed(c.score_diff)}</td>
      <td class="num">${c.regraded ? `<span class="badge error">${c.regraded}</span>` : "—"}</td>
    </tr>`).join("");
  return `<div class="card"><div class="scroll"><table>
      <thead><tr>
        <th>${t("th_comparison")}</th><th class="num">${t("th_pass_rate_ab")}</th>
        <th class="num">${t("th_paired")}</th><th class="num">${t("th_flips")}</th>
        <th class="num">${t("th_score_delta")}</th><th class="num">${t("th_regraded")}</th>
      </tr></thead><tbody>${body}</tbody>
    </table></div></div>
    <div class="note info">${t("comparisons_note", { regraded: t("regraded_word") })}</div>`;
}

// The analyzer ships a one-line verdict, already written. It is English prose,
// so for another language the sentence is recomposed here from the *same*
// structured stats the analyzer used (`pass_stats` / `score_stats` / n) rather
// than translated — the branch order below mirrors `ComparisonReport.verdict`.
// English always uses the analyzer's own string, so it cannot drift; any shape
// this function does not recognise falls back to it too.
function verdictText(c) {
  if (LANG === "en" || !c) return c && c.verdict ? c.verdict : "";
  const pass = c.pass_stats, score = c.score_stats;
  if (!c.n_paired) return t("verdict_none");
  if (!pass || !score) return c.verdict || "";

  const p1 = (x) => signedPct(x, 1);
  if (pass.significant) {
    return t("verdict_significant", {
      direction: pass.mean_diff, diff: p1(pass.mean_diff),
      low: p1(pass.ci_low), high: p1(pass.ci_high),
    });
  }
  if (score.significant) {
    return t("verdict_score_significant", {
      direction: score.mean_diff, diff: signed(score.mean_diff, 3),
      low: signed(score.ci_low, 3), high: signed(score.ci_high, 3),
    });
  }
  if (!pass.variance_observed) {
    return t("verdict_no_spread", { n: c.n_paired, diff: p1(pass.mean_diff) });
  }
  return t("verdict_noise", {
    n: c.n_paired, diff: p1(pass.mean_diff),
    low: p1(pass.ci_low), high: p1(pass.ci_high), mde: pct(pass.mde),
  });
}

function signedPct(x, digits) {
  const n = Number(x || 0) * 100;
  return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(digits == null ? 1 : digits) + "%";
}

function renderComparison(slug, entry, doc) {

  const flips = (list, cls) => (list || []).map((f) =>
    `<span class="badge ${cls}">${esc(f.case_id)} ${num(f.score_a)}→${num(f.score_b)}</span>`).join(" ");

  const scoped = (doc.scoped || []).map((s) => `

  const metrics = (doc.metrics || []).map((m) => {
    const digits = Math.abs(Number(m.mean_a || 0)) < 1 ? 4 : 2;

  const skipped = (doc.skipped || []).map((s) =>
    `<li><code>${esc(s.on || s.metric)}</code> — ${esc(s.reason)}</li>`).join("");

  view.innerHTML = `
    ${(c.regraded || []).length ? `<div class="note warn">${t("not_attributable", {
        n: c.regraded.length,
        ids: c.regraded.map((id) => `<code>${esc(id)}</code>`).join(", "),
      })}</div>` : ""}
    <div class="note info">${esc(verdictText(c))}</div>

    <div class="summary">
      <div class="summary-card"><div class="value">${pct(c.pass_rate_a)}</div>
        <div class="label">${t("card_pass_rate", { label: c.label_a })}</div></div>
      <div class="summary-card"><div class="value">${pct(c.pass_rate_b)}</div>
        <div class="label">${t("card_pass_rate", { label: c.label_b })}</div></div>
      <div class="summary-card${(c.improved || []).length ? " passed" : ""}">
        <div class="value">${(c.improved || []).length}</div>
        <div class="label">${t("card_fixed_by_b")}</div></div>
      <div class="summary-card${(c.regressed || []).length ? " failed" : ""}">
        <div class="value">${(c.regressed || []).length}</div>
        <div class="label">${t("card_broken_by_b")}</div></div>
      <div class="summary-card"><div class="value">${c.both_pass || 0}/${c.both_fail || 0}</div>
        <div class="label">${t("card_both")}</div></div>
    </div>

    ${(c.improved || []).length || (c.regressed || []).length ? `<div class="card"><div class="body">
      <div class="kv">${flips(c.improved, "passed")} ${flips(c.regressed, "failed")}</div></div></div>` : ""}

    ${scoped ? `<div class="card"><div class="scroll"><table>
      <thead><tr><th>${t("th_grader")}</th><th class="num">A</th><th class="num">B</th>
        <th class="num">${t("th_pass_rate_ab")}</th>
        <th class="num">${t("th_difference")}</th></tr></thead>
      <tbody>${scoped}</tbody></table></div>
      <div class="note info">${t("gate_note")}</div></div>` : ""}

    ${metrics ? `<div class="card"><div class="scroll"><table>
      <thead><tr><th>${t("th_process_metric")}</th><th class="num">A</th><th class="num">B</th>
        <th class="num">${t("th_trials")}</th>
        <th class="num">${t("th_difference")}</th></tr></thead>
      <tbody>${metrics}</tbody></table></div>
      <div class="note info">${t("metrics_note",
        { sampled: t("sampled_word") })}</div></div>` : ""}

    ${skipped ? `<div class="note warn">${t("not_compared")}<ul>${skipped}</ul></div>` : ""}`;
}

// ---------- run view ----------

function scatter(cases) {
  const w = 500, h = 500, padL = 60, padB = 60, padT = 30, padR = 30;
  const pw = w - padL - padR, ph = h - padT - padB, threshold = 0.7;
  const sx = (v) => padL + v * pw, sy = (v) => padT + (1 - v) * ph;
  const tx = sx(threshold), ty = sy(threshold);
  const rect = (x, y, ww, hh, cls) =>
    `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" class="${cls}"/>`;

  let svg = rect(tx, padT, sx(1) - tx, ty - padT, "zone-good")
    + rect(padL, padT, tx - padL, ty - padT, "zone-mixed")
    + rect(tx, ty, sx(1) - tx, sy(0) - ty, "zone-mixed")
    + rect(padL, ty, tx - padL, sy(0) - ty, "zone-poor")
    + `<line x1="${padL}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(0)}" class="axis"/>`
    + `<line x1="${padL}" y1="${sy(0)}" x2="${padL}" y2="${sy(1)}" class="axis"/>`
    + `<line x1="${padL}" y1="${ty}" x2="${sx(1)}" y2="${ty}" class="guide"/>`
    + `<line x1="${tx}" y1="${sy(0)}" x2="${tx}" y2="${sy(1)}" class="guide"/>`
    + `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" class="diag"/>`;

  [0, 0.2, 0.4, 0.6, 0.8, 1].forEach((v) => {
    svg += `<text x="${sx(v)}" y="${sy(0) + 20}" text-anchor="middle" class="tick">${v.toFixed(1)}</text>`
      + `<text x="${padL - 10}" y="${sy(v) + 4}" text-anchor="end" class="tick">${v.toFixed(1)}</text>`;
  });
  svg += `<text x="${padL + pw / 2}" y="${h - 10}" text-anchor="middle" class="axis-label">${esc(t("axis_outcome"))}</text>`
    + `<text x="15" y="${padT + ph / 2}" text-anchor="middle" class="axis-label"
        transform="rotate(-90, 15, ${padT + ph / 2})">${esc(t("axis_transcript"))}</text>`;

  cases.forEach((c) => {
    svg += `<circle cx="${sx(c.outcome_score || 0).toFixed(1)}" cy="${sy(c.transcript_score || 0).toFixed(1)}"
      r="6" class="dot ${c.passed ? "good" : "poor"}" opacity="0.85"><title>${esc(t("scatter_point",
        { id: c.case_id, outcome: num(c.outcome_score), transcript: num(c.transcript_score) }))}</title></circle>`;
  });

  return `<div class="card"><h2>${t("scatter_title")}</h2><div class="body" style="text-align:center">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="chart" role="img"
      aria-label="${esc(t("scatter_title"))}">${svg}</svg></div></div>`;
}

// Builds of this slug, oldest first: the trail plus the run on screen.
function trendSeries(entry, run) {
  if (!entry) return [];
  const trail = (entry.history || []).slice().reverse();
  return trail.concat([{
    generated: entry.generated, pass_rate: entry.pass_rate,
    average_score: entry.average_score, total_cases: entry.total_cases,
    evaluated_cases: entry.evaluated_cases, passed_cases: entry.passed_cases,
    contract: (run || {}).contract != null ? run.contract : entry.contract,
    skills: (run || {}).skills != null ? run.skills : entry.skills,
  }]);
}

function trendPanel(entry, run) {
  const series = trendSeries(entry, run);
  if (series.length < 2) return "";

  const w = 720, h = 200, padL = 46, padR = 16, padT = 16, padB = 34;
  const pw = w - padL - padR, ph = h - padT - padB;
  const step = series.length > 1 ? pw / (series.length - 1) : 0;
  const x = (i) => padL + i * step;
  const y = (v) => padT + (1 - Math.max(0, Math.min(1, Number(v || 0)))) * ph;
  const current = series[series.length - 1].contract || "";

  // Where the grading contract changed, the points either side were not
  // measured the same way — break the line instead of drawing through it.
  const segments = [];
  let run_ = [];
  series.forEach((p, i) => {
    const same = (p.contract || "") === current;
    if (!same) { if (run_.length > 1) segments.push(run_); run_ = []; return; }
    run_.push(`${x(i).toFixed(1)},${y(p.pass_rate).toFixed(1)}`);
  });
  if (run_.length > 1) segments.push(run_);

  let svg = "";
  [0, 0.25, 0.5, 0.75, 1].forEach((v) => {
    svg += `<line x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}" class="grid"/>`
      + `<text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" class="tick">${Math.round(v * 100)}%</text>`;
  });
  segments.forEach((pts) => {
    svg += `<polyline points="${pts.join(" ")}" class="series"/>`;
  });

  let stale = 0;
  series.forEach((p, i) => {
    const same = (p.contract || "") === current;
    if (!same) stale++;
    const band = !same ? "stale" : p.pass_rate >= 0.7 ? "good" : p.pass_rate >= 0.4 ? "medium" : "poor";
    const when = String(p.generated || "").slice(0, 10);
    svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.pass_rate).toFixed(1)}" r="${i === series.length - 1 ? 5 : 4}"
      class="dot ${band}">
      <title>${esc(t("trend_point", { when, rate: pct(p.pass_rate),
        passed: p.passed_cases || 0, total: p.evaluated_cases || 0 })
        + (same ? "" : t("other_contract"))
        // Which version this point measured. The line is not broken for it:
        // the subject moving is what this trend is *for*, unlike the contract.
        + (skillIds(p.skills).length ? " · " + skillIds(p.skills).join(", ") : ""))}</title></circle>`;
    if (i === 0 || i === series.length - 1) {
      svg += `<text x="${x(i)}" y="${h - 12}" text-anchor="${i ? "end" : "start"}"
        class="tick">${esc(when)}</text>`;
    }
  });

  const note = stale
    ? `<div class="note warn" style="margin-bottom:var(--s4)">${t("trend_stale",
        { n: stale, cmd: "compass compare" })}</div>`
    : "";

  return `<div class="card"><h2>${t("trend_title", { n: series.length })}</h2>
    <div class="body">${note}
    <div class="scroll"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="chart"
      role="img" aria-label="${esc(t("trend_alt"))}">${svg}</svg></div></div></div>`;
}

function categoryTable(rows) {
  if (!rows || !rows.length) return "";
  // Same rule as the summary tiles: a count of zero is not a verdict, so it
  // does not get a verdict's colour.
  const body = rows.map((r) => `<tr>
      <td><strong>${esc(r.category)}</strong></td>
      <td class="num">${r.total}</td>
      <td class="num${r.passed ? " pos" : ""}">${r.passed}</td>
      <td class="num${r.failed ? " neg" : ""}">${r.failed}</td>
      <td class="num${r.errors ? " warn" : ""}">${r.errors || 0}</td>
      <td class="num">${bar(r.pass_rate)}${pct(r.pass_rate)}</td>
      <td class="num">${num(r.average_score)}</td>
    </tr>`).join("");
  return `<div class="card"><h2>${t("category_title")}</h2><div class="scroll"><table>
    <thead><tr><th>${t("th_category")}</th><th class="num">${t("th_total")}</th>
      <th class="num">${t("th_passed")}</th><th class="num">${t("card_failed")}</th>
      <th class="num">${t("th_errors")}</th><th class="num">${t("th_pass_rate")}</th>
      <th class="num">${t("th_avg_score")}</th></tr></thead>
    <tbody>${body}</tbody></table></div></div>`;
}

function graderTable(caseRow) {
  const graders = caseRow.evaluator_results || [];
  if (!graders.length) return `<p class="dim">${t("no_graders")}</p>`;
  const body = graders.map((g) => {
    const status = g.skipped ? "skipped" : g.passed ? "passed" : "failed";
    const label = t(g.skipped ? "result_skipped" : g.passed ? "result_pass" : "result_fail");
    const score = g.score == null ? `<span class="dim">${t("unscored")}</span>` : num(g.score);
    const metrics = Object.entries(g.metrics || {})
      .map(([k, v]) => `<span class="badge tag">${esc(k)}=${esc(metric(v))}</span>`).join("");
    const extra = [tags(g.tags), tags(g.failure_tags), metrics].filter(Boolean).join(" ");
    return `<tr>
      <td class="mono">${esc(g.name)}</td>
      <td><span class="badge scope">${esc(g.grader_scope)}</span></td>
      <td>${esc(g.grader_type)}</td>
      <td class="num">${score}</td>
      <td class="num">${esc(g.weight != null ? g.weight : 1)}</td>
      <td><span class="badge ${status}">${label}</span></td>
      <td>${extra}${g.error ? `<div class="err">${esc(g.error)}</div>` : ""}
        ${g.skip_reason ? `<div class="muted">${esc(g.skip_reason)}</div>` : ""}</td>
    </tr>`;
  }).join("");
  return `<div class="scroll"><table>
    <thead><tr><th>${t("th_grader")}</th><th>${t("th_scope")}</th><th>${t("th_type")}</th>
      <th class="num">${t("th_score")}</th><th class="num">${t("th_weight")}</th>
      <th>${t("th_result")}</th><th>${t("th_observed")}</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

function caseDetail(caseRow, slug, traces) {
  const meta = [];
  if (caseRow.total_trials > 1) {
    meta.push(t("meta_trials", { passed: caseRow.passed_trials || 0, total: caseRow.total_trials }));
    meta.push(t("meta_best", { score: num(caseRow.best_score) }));
  }
  if (caseRow.error_trials) meta.push(t("meta_harness_errors", { n: caseRow.error_trials }));
  meta.push(t("meta_duration", { value: duration(caseRow.duration_ms) }));
  meta.push(t("meta_outcome", { score: num(caseRow.outcome_score) }));
  meta.push(t("meta_transcript", { score: num(caseRow.transcript_score) }));
  if (caseRow.grader_fingerprint) {
    meta.push(t("meta_contract", { hash: caseRow.grader_fingerprint.slice(0, 12) }));
  }

  const own = (traces || []).filter((p) => p.split("/").pop().split(".")[0] === caseRow.case_id);
  const links = own.length
    ? `<h3>${t("h_trace")}</h3>` + own.map((p) =>
        `<div><a href="runs/${esc(slug)}/traces/${esc(p)}" target="_blank" class="mono">${esc(p)}</a></div>`).join("")
    : "";

  // Rounded on the way out: sixteen digits of a pass rate is float noise
  // wearing the clothes of precision, and it pushes the block twice as wide.
  const trialMetrics = caseRow.trial_metrics && Object.keys(caseRow.trial_metrics).length
    ? `<h3>${t("h_trial_metrics")}</h3><pre>${esc(JSON.stringify(
        caseRow.trial_metrics, (k, v) => metric(v), 2))}</pre>` : "";

  return `<tr class="detail"><td colspan="7"><div class="body">
    <div class="kv">${meta.map((m) => `<span>${esc(m)}</span>`).join("")}</div>
    ${caseRow.error ? `<h3>${t("h_error")}</h3><pre>${esc(caseRow.error)}</pre>` : ""}
    <h3>${t("h_graders")}</h3>${graderTable(caseRow)}
    ${trialMetrics}${links}
  </div></td></tr>`;
}

function renderRun(slug, entry, doc) {
  const cases = (doc.scenarios || []).flatMap((s) => s.cases || []);
  const run = doc.run || {};
  document.getElementById("crumb").innerHTML = `<a href="#/">← ${t("all_runs")}</a>`;
  const name = (entry && entry.name) || run.name || slug;
  document.getElementById("title").textContent = name;
  // Several of these get opened side by side from CI links; the tab strip is
  // where you tell them apart.
  document.title = `${name} · Compass`;
  // What was installed belongs beside the run's name, the way a version does:
  // it is the answer to "which one is this", not a remark about the table.
  document.getElementById("subtitle").innerHTML = `<span>${esc(t("run_subtitle", {
    scenarios: run.scenarios || 0, cases: run.total_cases || 0,
    duration: duration(run.duration_ms), when: stampText(doc.generated || ""),
  }))}</span>` + ((run.skills || []).length
    ? `<span class="skills">${esc(t("skills_note"))} ${skillChips(run.skills)}</span>` : "");

  const rateLabel = run.error_cases
    ? t("pass_rate_evaluated", { n: run.evaluated_cases }) : t("th_pass_rate");

  const categories = [...new Set(cases.map((c) => c.category).filter(Boolean))].sort();
  const allTags = [...new Set(cases.flatMap((c) => (c.observed_tags || []).concat(c.tags || [])))].sort();
  const showScatter = doc.scopes && doc.scopes.outcome && doc.scopes.transcript;

  // Colour marks a verdict, so a zero count stays neutral: green on "0 passed"
  // and amber on "0 errors" are the same claim in opposite directions, and
  // neither is true.
  const tile = (value, label, tone) =>
    `<div class="summary-card${tone && value ? " " + tone : ""}">
      <div class="value">${value}</div><div class="label">${label}</div></div>`;

  view.innerHTML = `${schemaNote(doc)}
    <div class="summary">
      ${tile(run.scenarios || 0, t("card_scenarios"))}
      ${tile(run.passed_cases || 0, t("th_passed"), "passed")}
      ${tile(run.failed_cases || 0, t("card_failed"), "failed")}
      ${tile(run.error_cases || 0, t("th_errors"), "error")}
      ${tile(pct(run.pass_rate), esc(rateLabel))}
      ${tile(num(run.average_score), t("th_avg_score"))}
    </div>
    ${doc.details_redacted
      ? `<div class="note info">${t("details_redacted", { flag: "--include-details" })}</div>` : ""}
    ${trendPanel(entry, run)}
    ${showScatter ? scatter(cases) : ""}
    ${categoryTable(doc.categories)}
    <div class="card">
      <h2>${t("cases_title")}</h2>
      <div class="filters">
        <input id="f-text" type="search" placeholder="${esc(t("filter_placeholder"))}">
        <select id="f-status">
          <option value="">${t("all_statuses")}</option>
          <option value="passed">${t("status_passed")}</option>
          <option value="failed">${t("status_failed")}</option>
          <option value="error">${t("th_errors")}</option>
        </select>
        ${categories.length ? `<select id="f-category"><option value="">${t("all_categories")}</option>
          ${categories.map((c) => `<option>${esc(c)}</option>`).join("")}</select>` : ""}
        ${allTags.length ? `<select id="f-tag"><option value="">${t("all_tags")}</option>
          ${allTags.map((tag) => `<option>${esc(tag)}</option>`).join("")}</select>` : ""}
        <span class="count" id="f-count"></span>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>${t("th_case")}</th><th>${t("th_scenario")}</th><th>${t("th_status")}</th>
          <th class="num">${t("th_score")}</th><th class="num">${t("th_trials")}</th>
          <th class="num">${t("th_duration")}</th><th>${t("th_tags")}</th></tr></thead>
        <tbody id="case-body"></tbody>
      </table></div>
    </div>`;

  const body = document.getElementById("case-body");
  const store = ui[slug] || (ui[slug] = { text: "", status: "", category: "", tag: "", open: new Set() });
  const open = store.open;

  // Restore what the reader had set — this render may be a live refresh.
  ["text", "status", "category", "tag"].forEach((key) => {
    const el = document.getElementById("f-" + key);
    if (el && store[key]) el.value = store[key];
  });

  function matches(c) {
    const text = (store.text || "").toLowerCase();
    if (text && !((c.case_id + " " + c.scenario).toLowerCase().includes(text))) return false;
    if (store.status === "passed" && !c.passed) return false;
    if (store.status === "failed" && (c.passed || c.status === "error")) return false;
    if (store.status === "error" && c.status !== "error") return false;
    if (store.category && c.category !== store.category) return false;
    if (store.tag && !(c.observed_tags || []).concat(c.tags || []).includes(store.tag)) return false;
    return true;
  }

  function draw(focusKey) {
    const shown = cases.filter(matches);
    document.getElementById("f-count").textContent =
      t("shown_of", { shown: shown.length, total: cases.length });
    if (!shown.length) {
      body.innerHTML = `<tr><td colspan="7" class="empty">${t("no_matches")}</td></tr>`;
      return;
    }
    body.innerHTML = shown.map((c) => {
      const key = c.scenario + "/" + c.case_id;
      const status = c.status === "error" ? "error" : c.passed ? "passed" : "failed";
      const score = c.total_trials > 1 ? c.best_score : c.overall_score;
      const row = `<tr class="clickable" data-key="${esc(key)}">
        <td class="mono"><button type="button" class="disclosure"
          aria-expanded="${open.has(key)}"><strong>${esc(c.case_id)}</strong></button></td>
        <td class="muted trunc" title="${esc(c.scenario)}">${esc(c.scenario) || "—"}</td>
        <td><span class="badge ${status}">${t("status_" + status)}</span></td>
        <td class="num">${bar(score)} ${num(score)}</td>
        <td class="num">${c.total_trials > 1 ? `${c.passed_trials || 0}/${c.total_trials}` : "—"}</td>
        <td class="num">${duration(c.duration_ms)}</td>
        <td>${tags((c.observed_tags || []).concat(c.tags || []))}</td>
      </tr>`;
      return row + (open.has(key) ? caseDetail(c, slug, doc.traces) : "");
    }).join("");

    const rows = [...body.querySelectorAll("tr[data-key]")];
    rows.forEach((tr) => {
      // One handler for the row: a click anywhere in it toggles, and the
      // disclosure button's own Enter / Space arrives here by bubbling, so the
      // keyboard path and the mouse path cannot drift apart.
      tr.onclick = () => {
        const key = tr.dataset.key;
        open.has(key) ? open.delete(key) : open.add(key);
        draw(key);
      };
    });

    // Redrawing replaces the button that was just activated. Without this, a
    // keyboard reader is dropped back at the top of the document every time
    // they open a case.
    if (focusKey) {
      const row = rows.find((tr) => tr.dataset.key === focusKey);
      const button = row && row.querySelector(".disclosure");
      if (button) button.focus();
    }
  }

  ["text", "status", "category", "tag"].forEach((key) => {
    const el = document.getElementById("f-" + key);
    if (el) el.addEventListener("input", () => { store[key] = el.value; draw(); });
  });
  draw();
}

// ---------- router ----------

async function route() {
  const match = /^#\/run\/([^/]+)/.exec(location.hash);
  try {
    if (!state.index) state.index = await loadJSON("index.json");
  } catch (err) {
    view.innerHTML = `<div class="note warn">${t("index_unreadable",
      { error: esc(err.message), cmd: "compass site serve" })}</div>`;
    return;
  }

  const comparing = /^#\/compare\/([^/]+)/.exec(location.hash);
  if (comparing) {
    const slug = decodeURIComponent(comparing[1]);
    view.innerHTML = `<div class="empty">${esc(t("loading_slug", { slug }))}</div>`;
    try {
      if (!state.comparisons[slug]) {
        state.comparisons[slug] =
          await loadJSON(`comparisons/${encodeURIComponent(slug)}/comparison.json`);
      }
    } catch (err) {
      view.innerHTML = `<div class="note warn">${t("no_such_comparison",
        { slug: esc(slug), error: esc(err.message) })}
        <a href="#/">${t("back_to_runs")}</a></div>`;
      return;
    }
    renderComparison(
      slug,
      (state.index.comparisons || []).find((e) => e.slug === slug),
      state.comparisons[slug],
    );
    // A comparison is a snapshot of two finished runs; there is nothing to poll.
    return startPolling(null);
  }

  if (!match) {
    renderIndex();
    return startPolling(null);
  }

  const slug = decodeURIComponent(match[1]);
  const entry = (state.index.runs || []).find((e) => e.slug === slug);
  view.innerHTML = `<div class="empty">${esc(t("loading_slug", { slug }))}</div>`;
  try {
    if (!state.docs[slug]) state.docs[slug] = await loadJSON(`runs/${encodeURIComponent(slug)}/run.json`);
  } catch (err) {
    view.innerHTML = `<div class="note warn">${t("no_such_run",
      { slug: esc(slug), error: esc(err.message) })}
      <a href="#/">${t("back_to_runs")}</a></div>`;
    return;
  }
  renderRun(slug, entry, state.docs[slug]);
  startPolling(slug);
}

// A served page recomputes from disk on every request, so polling shows a run
// that is still being written. A built page is a snapshot and never changes.
function startPolling(slug) {
  clearInterval(state.poll);
  if (!state.index || !state.index.live) return;
  liveBadge();
  state.poll = setInterval(() => refresh(slug), POLL_MS);
}

function liveBadge() {
  const sub = document.getElementById("subtitle");
  if (sub && !sub.querySelector(".live")) {
    // The dot is drawn (and animated) by CSS, so the markup carries the word.
    sub.insertAdjacentHTML("beforeend",
      `<span class="live" title="${esc(t("live_title"))}">${esc(t("live"))}</span>`);
  }
}

async function refresh(slug) {
  try {
    const index = await loadJSON("index.json");
    const changed = JSON.stringify(index.runs) !== JSON.stringify((state.index || {}).runs);
    state.index = index;
    if (!slug) {
      if (changed) renderIndex();
      return liveBadge();
    }
    const doc = await loadJSON(`runs/${encodeURIComponent(slug)}/run.json`);
    if (JSON.stringify(doc) === JSON.stringify(state.docs[slug])) return;
    state.docs[slug] = doc;
    renderRun(slug, (index.runs || []).find((e) => e.slug === slug), doc);
    liveBadge();
  } catch (err) {
    // A results file mid-rewrite, or the server going away: keep what is on
    // screen and try again on the next tick rather than blanking the page.
  }
}

window.addEventListener("hashchange", route);
applyLang();
route();
</script>
